<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Flow Chart — Icon Export</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #FAF9F5; padding: 40px; color: #3D3929; }
  .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
  .box { text-align: center; }
  .box .frame { background: #fff; border: 1px solid #DAD9D4; border-radius: 8px; padding: 16px; display: inline-block; }
  button { margin-top: 10px; padding: 8px 16px; border-radius: 6px; border: none; background: #2B6CB0; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { background: #245a94; }
  h1 { font-size: 18px; margin-bottom: 20px; }
  p.hint { color: #83827D; font-size: 13px; max-width: 480px; }
</style>
</head>
<body>
<h1>Flow Chart — icon export (300×300 and 36×36)</h1>
<p class="hint">Click each button to download the PNG at the exact size AppSource / pbiviz requires. Save them as <code>assets/icon300.png</code> and <code>assets/icon.png</code> respectively.</p>

<div class="row">
  <div class="box">
    <div class="frame" id="frame300"></div>
    <div><button onclick="exportPng(300)">Download 300×300 PNG</button></div>
  </div>
  <div class="box">
    <div class="frame" id="frame36"></div>
    <div><button onclick="exportPng(36)">Download 36×36 PNG</button></div>
  </div>
</div>

<script>
const svgMarkup = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1F4E80"/>
      <stop offset="0.55" stop-color="#2B6CB0"/>
      <stop offset="1" stop-color="#5FA3E0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#g)"/>
  <!-- root node -->
  <rect x="10" y="42" width="22" height="16" rx="4" fill="#ffffff"/>
  <!-- links -->
  <path d="M32,50 C42,50 40,26 50,26" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M32,50 C42,50 40,74 50,74" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- level 2 nodes -->
  <rect x="50" y="18" width="20" height="16" rx="4" fill="#ffffff" opacity="0.92"/>
  <rect x="50" y="66" width="20" height="16" rx="4" fill="#ffffff" opacity="0.92"/>
  <!-- links to level 3 -->
  <path d="M70,26 C80,26 80,18 90,18" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M70,26 C80,26 80,34 90,34" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M70,74 C80,74 80,82 90,82" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- level 3 nodes -->
  <rect x="90" y="12" width="8" height="12" rx="2.5" fill="#ffffff" opacity="0.8"/>
  <rect x="90" y="28" width="8" height="12" rx="2.5" fill="#ffffff" opacity="0.8"/>
  <rect x="90" y="76" width="8" height="12" rx="2.5" fill="#ffffff" opacity="0.8"/>
</svg>`;

document.getElementById("frame300").innerHTML = svgMarkup.replace("<svg ", '<svg width="150" height="150" ');
document.getElementById("frame36").innerHTML = svgMarkup.replace("<svg ", '<svg width="72" height="72" ');

function exportPng(size) {
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const svgBlob = new Blob([svgMarkup], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function () {
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
    canvas.toBlob(function (blob) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = size === 300 ? "icon300.png" : "icon.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, "image/png");
  };
  img.src = url;
}
</script>
</body>
</html>
